# ==========================================
# 1. Global Context (Main Settings)
# ==========================================
user nginx;                         # System user assigned to worker processes
worker_processes auto;              # Automatically sets workers to match available CPU cores
pid /run/nginx.pid;                 # Path to the process ID file
error_log /var/log/nginx/error.log warn; # Path and minimal severity level for error logging

# ==========================================
# 2. Events Context (Connection Management)
# ==========================================
events {
    worker_connections 1024;        # Max simultaneous connections per worker process
    multi_accept on;                # Tell workers to accept all new connections at once
}

# ==========================================
# 3. HTTP Context (Web Traffic Configuration)
# ==========================================
http {
    # File Types and Streaming Optimizations
    include /etc/nginx/mime.types;          # Maps file extensions to MIME types
    default_type application/octet-stream;  # Default fallback MIME type
    
    sendfile on;                    # Copies data between file descriptors within the kernel
    tcp_nopush on;                  # Sends HTTP response headers in one packet instead of frames
    tcp_nodelay on;                 # Forces data packets to send immediately (good for keep-alive)
    keepalive_timeout 65;           # How long a persistent connection stays open on the server
    types_hash_max_size 2048;       # Controls memory allocated for type parsing maps

    # Access Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Include modular configs from other directories
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;

    # ==========================================
    # 4. Server Context (Virtual Host Configuration)
    # ==========================================
    server {
        listen 80 default_server;       # Listens on port 80 and catches unmatched domains
        listen [::]:80 default_server;  # IPv6 support
        server_name example.com www.example.com; # Handled domain names

        # Security and Upload Boundaries
        client_max_body_size 10m;       # Restricts file upload sizes to 10 Megabytes

        # ==========================================
        # 5. Location Contexts (URI Routing Rules)
        # ==========================================
        
        # Route 1: Serve Static Web Assets
        location / {
            root /var/www/html;         # Server filesystem directory for web files
            index index.html index.htm; # Default file served if directory root is hit
            try_files $uri $uri/ =404;  # Verifies asset existence or falls back to a 404
        }

        # Route 2: Reverse Proxy to an App Server (e.g., Node.js, Python, Go)
        location /api/ {
            proxy_pass http://127.0.0; # Forwards requests to local internal port 3000
            proxy_http_version 1.1;           # Required for keep-alive and websockets
            
            # Forward real client headers to the backend app
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route 3: Custom Error Pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
